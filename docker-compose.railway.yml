version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-budget_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:${PORT:-5000}
      ConnectionStrings__DefaultConnection: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_KEY: ${JWT_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-BudgetTrackerAPI}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-BudgetTrackerClient}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE_URL: ${API_URL:-http://api:5000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data: